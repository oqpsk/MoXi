<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
 <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://document.moxi.local data:; connect-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'">
 <title>MoXi</title><link rel="stylesheet" href="editor.css">
</head>
<body class="focus">
 <div id="format" role="toolbar" aria-label="文字格式">
  <select id="block" aria-label="段落格式"><option value="0">正文</option><option value="1">标题 1</option><option value="2">标题 2</option><option value="3">标题 3</option><option value="4">标题 4</option><option value="5">标题 5</option><option value="6">标题 6</option></select>
  <span class="divider"></span>
  <button data-format="bold" title="粗体 · Ctrl+B" aria-label="粗体"><svg viewBox="6 4 13 16"><path d="M6 12h9a4 4 0 0 1 0 8H6V4h8a4 4 0 0 1 0 8Z"/></svg></button>
  <button data-format="italic" title="斜体 · Ctrl+I" aria-label="斜体"><svg viewBox="5 4 14 16"><path d="M19 4H9M15 20H5M15 4 9 20"/></svg></button>
  <button data-format="strike" title="删除线" aria-label="删除线"><svg viewBox="3 3.5 18 17"><path d="M17 5c-1.2-1-2.6-1.5-4.5-1.5-3 0-5 1.5-5 3.5 0 1 .5 1.8 1.5 2.5M7 19c1.2 1 2.8 1.5 4.7 1.5 3.1 0 5.3-1.5 5.3-3.7 0-1.4-1-2.4-2.5-3M3 12h18"/></svg></button>
  <button data-format="code" title="行内代码 · Ctrl+E" aria-label="行内代码"><svg viewBox="3 4 18 16"><path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-13-2 16"/></svg></button>
  <span class="divider"></span>
  <button data-format="bulletList" title="无序列表" aria-label="无序列表"><svg viewBox="3.4 5.4 17.6 13.2"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r=".6"/><circle cx="4" cy="12" r=".6"/><circle cx="4" cy="18" r=".6"/></svg></button>
  <button data-format="orderedList" title="有序列表" aria-label="有序列表"><svg viewBox="2 3 19 18"><path d="M10 5h11M10 12h11M10 19h11M3 3h1v4M2 7h4M2 11c0-2 4-2 4 0 0 1-4 2-4 3h4M2 17h2.5a1 1 0 0 1 0 2H3h1.5a1 1 0 0 1 0 2H2"/></svg></button>
  <button data-format="taskList" title="任务清单" aria-label="任务清单"><svg viewBox="3 2.5 18 19"><path d="m3 5 2 2 3-4M12 5h9M12 12h9M12 19h9M3 10h5v5H3ZM3 17h5v5H3Z" transform="translate(0 -.5)"/></svg></button>
  <button data-format="blockquote" title="引用" aria-label="引用"><svg viewBox="4 5 16 14"><path d="M4 5h6v7H4ZM4 12c0 5 3 7 6 7M14 5h6v7h-6ZM14 12c0 5 3 7 6 7"/></svg></button>
  <span class="divider"></span>
  <button data-format="link" title="插入链接 · Ctrl+K" aria-label="插入链接"><svg viewBox="2.5295 1.5295 18.9409 20.9409"><path d="M10 13a5 5 0 0 0 7 .1l3-3a5 5 0 0 0-7.1-7.1l-1.7 1.7M14 11a5 5 0 0 0-7-.1l-3 3a5 5 0 0 0 7.1 7.1l1.7-1.7"/></svg></button>
  <button data-format="codeBlock" title="代码块" aria-label="代码块"><svg viewBox="3 3 18 18"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m7 9 3 3-3 3m6 0h4"/></svg></button>
  <button data-format="table" title="插入 3 × 3 表格；表格内右键可增删行列" aria-label="插入表格"><svg viewBox="3 3 18 18"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></button>
  <button data-format="horizontalRule" title="分隔线" aria-label="分隔线"><svg viewBox="4 4 16 16"><path d="M4 12h16"/></svg></button>
  <span class="format-spacer"></span><button data-format="undo" title="撤销 · Ctrl+Z" aria-label="撤销"><svg viewBox="3 4 16.5 16"><path d="M8 4 3 9l5 5M3 9h11a5.5 5.5 0 0 1 0 11h-3"/></svg></button><button data-format="redo" title="重做 · Ctrl+Y" aria-label="重做"><svg viewBox="4.5 4 16.5 16"><path d="m16 4 5 5-5 5M21 9H10a5.5 5.5 0 0 0 0 11h3"/></svg></button>
 </div>
 <div id="notice" role="status" hidden></div>
 <div id="find-bar" hidden><input id="find-input" placeholder="在文档中查找" aria-label="查找内容"><span id="find-result" aria-live="polite">0 / 0</span><button data-action="find-prev" title="上一处 · Shift+Enter">↑</button><button data-action="find-next" title="下一处 · Enter">↓</button><button data-action="find-close" title="关闭 · Esc">×</button></div>
 <div id="workspace">
  <aside id="outline" hidden><div class="aside-label">目录</div><nav id="outline-items" aria-label="文档目录"></nav></aside>
  <main id="scroll"><div id="page"><div id="editor"></div><article id="preview" class="prose" tabindex="-1" hidden></article><div id="source-wrap" hidden><pre id="source-render" aria-hidden="true"></pre><textarea id="source" spellcheck="false" aria-label="Markdown 源码" hidden></textarea></div></div></main>
 </div>
 <div id="table-menu" class="popover" hidden><button data-table="addRowAfter">在下方插入行</button><button data-table="addColumnAfter">在右侧插入列</button><button data-table="deleteRow">删除行</button><button data-table="deleteColumn">删除列</button><button data-table="deleteTable">删除表格</button></div>
 <dialog id="link-dialog"><form method="dialog"><h2>插入链接</h2><label for="link-url">地址</label><input id="link-url" placeholder="https:// 或相对文件路径" autocomplete="off"><div class="dialog-actions"><button value="cancel">取消</button><button value="ok" class="primary">插入</button></div></form></dialog>
 <script src="editor.js"></script>
</body></html>
